name: CI

on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
      - '[0-9]+.x'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'opensearch-project/opensearch-mcp-server-py'
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check code quality
        run: uv run ruff check .

  test:
    if: github.repository == 'opensearch-project/opensearch-mcp-server-py'
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv venv
          .\.venv\Scripts\Activate.ps1
          uv sync

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pytest

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      - name: Install from tar.gz (Unix)
        if: runner.os != 'Windows'
        run: pip install dist/*.tar.gz

      - name: Install from tar.gz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = Get-ChildItem dist/*.tar.gz | Select-Object -First 1
          pip install $tarball.FullName

      - name: Show metadata (tar.gz)
        run: pip show opensearch-mcp-server-py

      - name: Uninstall tar.gz package
        run: pip uninstall -y opensearch-mcp-server-py

      - name: Install from wheel (Unix)
        if: runner.os != 'Windows'
        run: pip install dist/*.whl

      - name: Install from wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          pip install $wheel.FullName

      - name: Show metadata (wheel)
        run: pip show opensearch-mcp-server-py
