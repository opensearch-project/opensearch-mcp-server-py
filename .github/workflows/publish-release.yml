name: Release Workflow

on:
  push:
    tags:
      - "*"

jobs:
  release-to-pypi:
    environment: release-approval
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install build tools
        run: |
          python -m pip install --upgrade build twine

      - name: Build project for distribution
        run: |
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  docker-staging:
    needs: [release-to-pypi]
    if: github.repository == 'opensearch-project/opensearch-mcp-server-py'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.MCP_SERVER_DOCKER_ROLE }}
          aws-region: us-east-1

      - name: Retrieve Docker Hub password
        id: retrieve-password
        run: |
          DOCKERHUB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id jenkins-staging-dockerhub-credential --query SecretString --output text)
          echo "::add-mask::$DOCKERHUB_PASSWORD"
          echo "dockerhub-password=$DOCKERHUB_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.MCP_SERVER_DOCKER_USERNAME }}
          password: ${{ steps.retrieve-password.outputs.dockerhub-password }}

      - name: Build and push multi-platform image to staging
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "opensearchstaging/opensearch-mcp-server-py:$VERSION" \
            --push .

      - name: Logout of Docker Hub
        if: always()
        run: docker logout

  # Jenkins (jenkins/release.jenkinsFile) triggers on the published pre-release and copies the image to production.
  github-release:
    needs: [docker-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
